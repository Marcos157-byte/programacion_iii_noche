<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>CONTACTO</title>
</head>

<body bgcolor="LightCyan">
    <h1>
        <pre><strong>Contactanos</strong></pre>
    </h1>
    <form action="partion.php" method="post">
        <fieldset align="center"        >
            <legend>
                Contactanos
            </legend>
            <table align="center">
                <tr>
                    <td>
                        <label for="nombre">Nombre del Cliente</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Escribe tu Nombre Completo">
                    </td>


                    <td>
                        <label for="fecha">Fecha de nacimineto</label>
                        <input type="date" id="fecha" name="fecha" placeholder="Esbribe tu fecha de nacimineto">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="correo">Correo Electronico</label>
                        <input type="email" id="correo" name="correo" placeholder="Ingrese su Correo">

                    </td>
                    <td>

                        <label for="genero">Genero</label>
                        <input type="radio" id="m" name="genero"> <label for="m">Masculino</label>
                        <input type="radio" id="f" name="Femenino"> <label for="f">Femenino</label>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="pais">Pais</label>
                        <select id="pais" name="pais">
                            <option value="ec">Ecuador</option>
                            <option value="eu">Estados Unidos</option>
                            <option value="es">España</option>
                        </select>
                    </td>
                </tr>
                
            </table>
            <button ><a href="gracias.html">Enviar</a></button>
        </fieldset>
    </form>
