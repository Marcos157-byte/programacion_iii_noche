<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Manipulación de DOM en Tienda de Jeans</title>
    <script src="04_crear_elemento.js" defer></script>
    <style>
        .parrafo {
            color: brown;
            font-weight: bold;
            margin-top: 10px;
        }
        .boton {
            padding: 10px;
            background-color: navy;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <h1>Crear y Eliminar elementos dinámicos</h1>

    
    <div id="contenedor"></div>

   
    <button id="crear" class="boton">Crear producto</button>
    <button id="eliminar" class="boton">Eliminar producto</button>
    <button id="btnDobleClick" class="boton">DOBLE CLICK</button>

    
    <form id="formulario" style="margin-top: 20px;">
        <input type="text" id="nombre" placeholder="Escribe tu nombre">
        <button type="submit" class="boton">Enviar</button>
    </form>

        
</body>
</html>
